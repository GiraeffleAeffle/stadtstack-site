name: Image
on:
  workflow_dispatch:
  push:
    tags: ['image-*']
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/giraeffleaeffle/stadtstack-site
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "DIGEST: ${DIGEST}"
          {
            echo '### Stadtstack site image'
            echo "Image: \`${IMAGE}@${DIGEST}\`"
            echo "Source commit: \`${GITHUB_SHA}\`"
            echo "DIGEST: ${DIGEST}"
            echo 'Pin this digest in deploy/values/stadtstack.eu.yaml before release.'
            echo 'Make the GHCR package public after the first push; the cluster has no pull secret.'
          } >> "$GITHUB_STEP_SUMMARY"
