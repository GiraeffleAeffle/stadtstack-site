worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self' __SCRIPT_CSP__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;

  server {
    listen 8080 default_server;
    server_name _;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
  }
  server {
    listen 8080;
    server_name stadtstack.eu;
    root /usr/share/nginx/html;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /_next/static/ {
      expires 1y;
      try_files $uri =404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
  }
  server {
    listen 8080;
    server_name www.stadtstack.eu;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://stadtstack.eu$request_uri; }
  }
  server {
    listen 8080;
    server_name roebel.stadtstack.eu;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://roebel-web.staging.agentcart.eu$request_uri; }
  }
}
